<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Grupo Liquidámbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #065dac;
    --lime: #cddc28;
    --ink: #16232f;
    --ink-soft: #5a6570;
    --red: #b5453b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: #ffffff;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    max-width: 380px;
    width: 90%;
    padding: 40px 36px;
    border-radius: 16px;
    border: 1.5px solid #e7e9ec;
    box-shadow: 0 12px 32px rgba(6,93,172,0.08);
  }
  .logo {
    display: block;
    width: 120px;
    height: auto;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 24px;
    text-align: center;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #dde1e5;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus {
    outline: none;
    border-color: var(--blue);
  }
  button {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  button:hover { background: #054a87; }
  .error {
    background: #fbeceb;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 8px;
    font-size: 13px;
    padding: 9px 12px;
    margin-bottom: 16px;
    display: none;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--blue); }
</style>
</head>

    <h1>Iniciar sesión</h1>
    <div class="error" id="errorBox"></div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Entrar</button>
    <a class="back-link" href="/">← Volver al inicio</a>
  </form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.style.display = "none";
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorBox.textContent = data.error || "No se pudo iniciar sesión.";
      errorBox.style.display = "block";
      return;
    }
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    window.location.href = (next && next.startsWith("/")) ? next : "/panel/";
  } catch (err) {
    errorBox.textContent = "Error de conexión. Intenta de nuevo.";
    errorBox.style.display = "block";
  }
});
</script>
