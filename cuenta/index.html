<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración de la Cuenta — Grupo Liquidámbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #065dac;
    --lime: #cddc28;
    --ink: #16232f;
    --ink-soft: #5a6570;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: #fafbfc;
    color: var(--ink);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    background: #fff;
    border-bottom: 1px solid #e7e9ec;
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  .topbar-brand img { height: 26px; width: auto; }
  .topbar-links { display: flex; gap: 20px; align-items: center; }
  .topbar-links a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 13px; }
  .topbar-links a:hover { text-decoration: underline; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  p.sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 32px; }

  .card {
    background: #fff;
    border: 1.5px solid #e7e9ec;
    border-radius: 14px;
    padding: 28px 30px;
    margin-bottom: 22px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 20px; }

  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .field { flex: 1; min-width: 200px; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); font-weight: 600; margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border: 1.5px solid #dde1e5; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--blue); }

  .seg-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg-input {
    box-sizing: border-box;
    flex-shrink: 0;
    padding: 10px 6px; border: 1.5px solid #dde1e5; border-radius: 8px;
    font-size: 14px; font-family: 'IBM Plex Mono', monospace; text-align: center;
    background: #fff; text-transform: uppercase;
  }
  .seg-input:focus { outline: none; border-color: var(--blue); }
  .seg-input::placeholder { color: #c2c8ce; }
  .field input::placeholder { color: #c2c8ce; }
  .seg-sep { color: var(--ink-soft); font-weight: 700; font-size: 14px; }

  .readonly-value {
    padding: 10px 12px; border: 1.5px solid #eef0f2; border-radius: 8px;
    background: #f7f8f9; color: var(--ink); font-size: 14px; min-width: 60px;
  }
  .btn-inline-link {
    background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 0; white-space: nowrap;
  }
  .btn-inline-link:hover { text-decoration: underline; }

  .logo-row { display: flex; align-items: center; gap: 20px; margin-bottom: 4px; }
  .logo-preview {
    width: 84px; height: 84px; border-radius: 12px; border: 1.5px solid #e7e9ec;
    display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fafbfc;
  }
  .logo-preview img { max-width: 100%; max-height: 100%; }
  .logo-preview .placeholder { font-size: 11px; color: var(--ink-soft); text-align: center; padding: 8px; }
  .logo-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn-file {
    display: inline-block; padding: 8px 16px; border: 1.5px solid var(--blue); color: var(--blue);
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  }
  .btn-file:hover { background: #eaf2fa; }
  .btn-remove-logo { background: none; border: none; color: #b5453b; font-size: 12px; cursor: pointer; text-align: left; padding: 0; }

  .actions { display: flex; align-items: center; gap: 16px; }
  .btn-save {
    background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 12px 28px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn-save:hover { background: #054a87; }
  .status { font-size: 13px; color: var(--ink-soft); }
  .status.ok { color: #3f8f6a; }
  .status.error { color: #b5453b; }
</style>
</head>

  <div class="wrap">
    <h1>Configuración de la Cuenta</h1>
    <p class="sub">Esta información se usará en facturas y otros documentos del sistema.</p>

    <form id="settingsForm">

      <div class="card">
        <h2>Logo</h2>
        <div class="logo-row">
          <div class="logo-preview" id="logoPreview"><div class="placeholder">Sin logo</div></div>
          <div class="logo-actions">
            <label class="btn-file">
              Subir logo
              <input type="file" id="logoInput" accept="image/*" style="display:none">
            </label>
            <button type="button" class="btn-remove-logo" id="removeLogo" style="display:none">Quitar logo</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Datos del Negocio</h2>
        <div class="row">
          <div class="field"><label>Nombre Comercial</label><input id="company_name" required></div>
          <div class="field"><label>Razón Social</label><input id="legal_name"></div>
        </div>
        <div class="row">
          <div class="field"><label>RTN</label><input id="tax_id"></div>
          <div class="field"><label>Moneda</label>
            <select id="currency">
              <option value="HNL">Lempiras (HNL)</option>
              <option value="USD">Dólares (USD)</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field" style="flex-basis:100%"><label>Dirección</label><input id="address"></div>
        </div>
        <div class="row">
          <div class="field"><label>Teléfono</label><input id="phone"></div>
          <div class="field"><label>Correo</label><input id="email" type="email"></div>
        </div>
        <div class="row">
          <div class="field"><label>Sitio Web</label><input id="website"></div>
        </div>
      </div>

      <div class="card">
        <h2>Facturación</h2>

        <div class="field" style="margin-bottom:18px">
          <label>Prefijo de Factura</label>
          <div class="seg-group" id="seg-invoice_prefix" data-sep="-">
            <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-numeric maxlength="2" placeholder="00" style="width:52px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-numeric maxlength="8" placeholder="00000000" style="width:130px">
          </div>
        </div>

        <div class="field" style="margin-bottom:18px; max-width:320px">
          <label>Próximo Número</label>
          <div style="display:flex; align-items:center; gap:12px">
            <div class="readonly-value mono" id="next_invoice_number_display">—</div>
            <button type="button" class="btn-inline-link" id="btn-set-next-invoice">Establecer número inicial</button>
          </div>
          <input type="hidden" id="next_invoice_number">
        </div>

        <div class="field" style="margin-bottom:18px">
          <label>Código de Autorización de Impresión (C.A.I.)</label>
          <div class="seg-group" id="seg-cai" data-sep="-">
            <input class="seg-input" data-alnum maxlength="6" style="width:104px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-alnum maxlength="6" style="width:104px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-alnum maxlength="6" style="width:104px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-alnum maxlength="6" style="width:104px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-alnum maxlength="6" style="width:104px">
            <span class="seg-sep">-</span>
            <input class="seg-input" data-alnum maxlength="2" style="width:52px">
          </div>
        </div>

        <div class="field" style="margin-bottom:18px">
          <label>Fecha Límite de Emisión</label>
          <div class="seg-group" id="seg-cai_fecha_limite" data-sep="/">
            <input class="seg-input" data-numeric maxlength="2" placeholder="DD" style="width:52px">
            <span class="seg-sep">/</span>
            <input class="seg-input" data-numeric maxlength="2" placeholder="MM" style="width:52px">
            <span class="seg-sep">/</span>
            <input class="seg-input" data-numeric maxlength="4" placeholder="AAAA" style="width:78px">
          </div>
        </div>

        <div class="field">
          <label>Rango Autorizado</label>
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px">
            <span style="font-size:12px; color:var(--ink-soft); width:52px">Desde</span>
            <div class="seg-group" id="seg-rango_autorizado_desde" data-sep="-">
              <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="2" placeholder="00" style="width:52px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="8" placeholder="00000000" style="width:130px">
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap">
            <span style="font-size:12px; color:var(--ink-soft); width:52px">Hasta</span>
            <div class="seg-group" id="seg-rango_autorizado_hasta" data-sep="-">
              <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="3" placeholder="000" style="width:65px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="2" placeholder="00" style="width:52px">
              <span class="seg-sep">-</span>
              <input class="seg-input" data-numeric maxlength="8" placeholder="00000000" style="width:130px">

          </div>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-save">Guardar Cambios</button>
        <span class="status" id="statusMsg"></span>
      </div>
    </form>

    <div class="card" style="margin-top:8px">
      <h2>Actividad Reciente</h2>
      <table style="width:100%; border-collapse:collapse; font-size:13px">
        <thead><tr>
          <th style="text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid #e7e9ec">Evento</th>
          <th style="text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid #e7e9ec">Fecha/Hora</th>
        </tr></thead>
        <tbody id="activityBody"></tbody>
      </table>
    </div>
  </div>

<script>
async function loadActivity() {
  const events = await fetch("/api/account/activity").then(r => r.json());
  document.getElementById("activityBody").innerHTML = events.map(e => `
    <tr>
      <td style="padding:8px; border-bottom:1px solid #f0f1f3">${e.event_type === 'login' ? 'Inicio de sesión' : 'Cierre de sesión'}</td>
      <td style="padding:8px; border-bottom:1px solid #f0f1f3; color:var(--ink-soft)">${e.timestamp}</td>
    </tr>
  `).join("") || '<tr><td colspan="2" style="padding:8px; color:var(--ink-soft)">Sin actividad registrada todavía.</td></tr>';
}
loadActivity();
</script>

<script>
let logoDataUrl = null;

// ---- Segmented input groups (Prefijo, CAI, Fecha Límite, Rango Autorizado) ----
function setupSegmentedGroup(groupEl) {
  const inputs = Array.from(groupEl.querySelectorAll(".seg-input"));
  inputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      let val = input.value;
      if (input.hasAttribute("data-numeric")) val = val.replace(/[^0-9]/g, "");
      else if (input.hasAttribute("data-alnum")) val = val.toUpperCase().replace(/[^A-Z0-9]/g, "");
      input.value = val;
      if (val.length >= parseInt(input.maxLength) && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      }
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && input.value === "" && idx > 0) {
        inputs[idx - 1].focus();
      }
    });
  });
}

function getSegmentedValue(groupId) {
  const group = document.getElementById(groupId);
  const sep = group.dataset.sep;
  const values = Array.from(group.querySelectorAll(".seg-input")).map(i => i.value);
  if (values.every(v => v === "")) return "";
  return values.join(sep);
}

function sanitizeSegmentValue(input, raw) {
  if (input.hasAttribute("data-numeric")) return (raw || "").replace(/[^0-9]/g, "").slice(0, input.maxLength);
  if (input.hasAttribute("data-alnum")) return (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, input.maxLength);
  return (raw || "").slice(0, input.maxLength);
}

function setSegmentedValue(groupId, value) {
  const group = document.getElementById(groupId);
  const sep = group.dataset.sep;
  const inputs = Array.from(group.querySelectorAll(".seg-input"));
  const parts = (value || "").split(sep);
  inputs.forEach((input, idx) => {
    input.value = sanitizeSegmentValue(input, parts[idx]);
  });
}

document.querySelectorAll(".seg-group").forEach(setupSegmentedGroup);

function setNextInvoiceNumber(value) {
  document.getElementById("next_invoice_number").value = value;
  document.getElementById("next_invoice_number_display").textContent = value;
  document.getElementById("btn-set-next-invoice").textContent =
    (value && value > 1) ? "Cambiar número inicial" : "Establecer número inicial";
}

document.getElementById("btn-set-next-invoice").addEventListener("click", () => {
  const last = prompt("¿Cuál fue el último número de factura usado? (se guardará el siguiente número, +1)");
  if (last === null) return; // cancelled
  const lastNum = parseInt(last, 10);
  if (isNaN(lastNum) || lastNum < 0) {
    alert("Ingresa un número válido.");
    return;
  }
  setNextInvoiceNumber(lastNum + 1);
});

async function loadProfile() {
  const res = await fetch("/api/account");
  const p = await res.json();
  document.getElementById("company_name").value = p.company_name || "";
  document.getElementById("legal_name").value = p.legal_name || "";
  document.getElementById("tax_id").value = p.tax_id || "";
  document.getElementById("currency").value = p.currency || "HNL";
  document.getElementById("address").value = p.address || "";
  document.getElementById("phone").value = p.phone || "";
  document.getElementById("email").value = p.email || "";
  document.getElementById("website").value = p.website || "";
  setSegmentedValue("seg-invoice_prefix", p.invoice_prefix);
  setNextInvoiceNumber(p.next_invoice_number || 1);
  setSegmentedValue("seg-cai", p.cai);
  setSegmentedValue("seg-cai_fecha_limite", p.cai_fecha_limite);
  setSegmentedValue("seg-rango_autorizado_desde", p.rango_autorizado_desde);
  setSegmentedValue("seg-rango_autorizado_hasta", p.rango_autorizado_hasta);
  logoDataUrl = p.logo_data_url || null;
  renderLogoPreview();
}

function renderLogoPreview() {
  const preview = document.getElementById("logoPreview");
  const removeBtn = document.getElementById("removeLogo");
  if (logoDataUrl) {
    preview.innerHTML = '<img src="' + logoDataUrl + '" alt="">';
    removeBtn.style.display = "block";
  } else {
    preview.innerHTML = '<div class="placeholder">Sin logo</div>';
    removeBtn.style.display = "none";
  }
}

document.getElementById("logoInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    logoDataUrl = reader.result;
    renderLogoPreview();
  };
  reader.readAsDataURL(file);
});

document.getElementById("removeLogo").addEventListener("click", () => {
  logoDataUrl = null;
  document.getElementById("logoInput").value = "";
  renderLogoPreview();
});

document.getElementById("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const statusMsg = document.getElementById("statusMsg");
  statusMsg.textContent = "Guardando...";
  statusMsg.className = "status";

  const body = {
    company_name: document.getElementById("company_name").value,
    legal_name: document.getElementById("legal_name").value,
    tax_id: document.getElementById("tax_id").value,
    currency: document.getElementById("currency").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    website: document.getElementById("website").value,
    invoice_prefix: getSegmentedValue("seg-invoice_prefix"),
    next_invoice_number: document.getElementById("next_invoice_number").value,
    cai: getSegmentedValue("seg-cai"),
    cai_fecha_limite: getSegmentedValue("seg-cai_fecha_limite"),
    rango_autorizado_desde: getSegmentedValue("seg-rango_autorizado_desde"),
    rango_autorizado_hasta: getSegmentedValue("seg-rango_autorizado_hasta"),
    logo_data_url: logoDataUrl,
  };

  try {
    const res = await fetch("/api/account", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      statusMsg.textContent = data.error || "Error al guardar.";
      statusMsg.className = "status error";
      return;
    }
    statusMsg.textContent = "Guardado ✓";
    statusMsg.className = "status ok";
    setTimeout(() => { statusMsg.textContent = ""; }, 2500);
  } catch (err) {
    statusMsg.textContent = "Error de conexión.";
    statusMsg.className = "status error";
  }
});

loadProfile();
</script>
</body>
</html>
