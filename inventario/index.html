<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario — Grupo Liquidámbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --blue: #065dac; --lime: #cddc28; --ink: #16232f; --ink-soft: #5a6570; --good: #3f8f6a; --danger: #b5453b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Poppins', sans-serif; background: #fafbfc; color: var(--ink); }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; background: #fff; border-bottom: 1px solid #e7e9ec; }
  .topbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  .topbar-links { display: flex; gap: 20px; align-items: center; }
  .topbar-links a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 13px; }
  .topbar-links a:hover { text-decoration: underline; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }

  .btn { border: 1.5px solid var(--ink); background: #fff; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover { background: #054a87; }
  .btn-ghost { border-color: #dde1e5; color: var(--ink-soft); }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---- summary cards ---- */
  .summary-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .summary-card { background: #fff; border: 1px solid #e7e9ec; border-radius: 12px; padding: 16px 20px; min-width: 180px; flex: 1; }
  .summary-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 6px; }
  .summary-card .value { font-size: 22px; font-weight: 700; }
  .summary-card.total .value { color: var(--danger); }

  .filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .filter-field input, .filter-field select { border: 1.5px solid #dde1e5; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .filter-check { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-soft); padding-bottom: 9px; cursor: pointer; }
  .filter-check input { width: 15px; height: 15px; cursor: pointer; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid #e7e9ec; border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); padding: 10px 14px; border-bottom: 1px solid #e7e9ec; background: #fafbfc; }
  td { padding: 12px 14px; border-bottom: 1px solid #f0f1f3; }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #f7f9fb; }
  .num { text-align: right; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; background: #eaf2fa; color: var(--blue); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 14px; }

  .estado-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .estado-badge.tipo-entrada { background: rgba(63,143,106,0.14); color: #3f8f6a; }
  .estado-badge.tipo-salida { background: rgba(181,69,59,0.12); color: #b5453b; }
  .estado-badge.tipo-ajuste { background: rgba(6,93,172,0.1); color: var(--blue); }
  .text-good { color: var(--good); }
  .text-danger { color: var(--danger); }

  tr.bajo-stock td:first-child { border-left: 4px solid var(--danger); }
  .bajo-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--danger); margin-left: 8px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,41,66,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-backdrop[hidden] { display: none; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 480px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 16px; font-size: 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .modal .field input, .modal .field select { width: 100%; border: 1.5px solid #dde1e5; border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; }
  .modal .field-row { display: flex; gap: 12px; }
  .modal .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-error { color: var(--danger); font-size: 12.5px; margin-top: 6px; min-height: 16px; }

  .app-shell { display: flex; }
  .sidebar { width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid #e7e9ec; min-height: calc(100vh - 61px); padding: 24px 0; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: baseline; gap: 8px; text-align: left; background: none; border: none; padding: 11px 24px;
              font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .nav-item:hover { background: #f7f9fb; color: var(--ink); }
  .nav-item.active { color: var(--blue); background: #eaf2fa; border-right: 3px solid var(--blue); }
  .nav-item.disabled { color: #c3c9cf; cursor: default; }
  .nav-item.disabled:hover { background: none; color: #c3c9cf; }
  .nav-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .content { flex: 1; min-width: 0; }
  .view { display: none; }
  .view.active { display: block; }

  @media screen and (max-width: 800px) {
    .topbar { padding: 14px 16px; flex-wrap: wrap; gap: 8px; }
    .app-shell { flex-direction: column; }
    .sidebar {
      width: 100%; min-height: auto; border-right: none; border-bottom: 1px solid #e7e9ec;
      padding: 8px 4px; position: sticky; top: 0; z-index: 10;
    }
    .nav { flex-direction: row; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 4px; }
    .nav-item { flex-shrink: 0; padding: 10px 14px; border-right: none !important; border-radius: 8px; white-space: nowrap; }
    .wrap { padding: 20px 14px 60px; }
    .head-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .toolbar { flex-wrap: wrap; }
    .btn { padding: 11px 16px; }
    table { font-size: 12.5px; }
    th, td { padding: 10px; }
    .modal { width: 100%; max-width: 100vw; border-radius: 12px 12px 0 0; position: fixed; bottom: 0; left: 0; right: 0; margin: 0; max-height: 80vh; }
    .modal-backdrop { align-items: flex-end; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand"><span id="topbarClient">Inventario</span></div>
    <div class="topbar-links">
      <a href="/panel/">← Panel</a>
      <a href="/logout">Cerrar sesión</a>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <nav class="nav">
        <button class="nav-item active" data-view="existencias">
          <span class="nav-code">01</span> Existencias
        </button>
        <button class="nav-item" data-view="movimientos">
          <span class="nav-code">02</span> Movimientos
        </button>
        <button class="nav-item disabled" disabled title="Próximamente">
          <span class="nav-code">03</span> Reportes
        </button>
      </nav>
    </aside>

    <div class="content">
      <section id="view-existencias" class="view active">
        <div class="wrap">
          <div class="head-row">
            <h1>Existencias</h1>
          </div>

          <div class="summary-row">
            <div class="summary-card">
              <div class="label">Valor Total de Inventario</div>
              <div class="value mono" id="invSummaryValor">L. 0.00</div>
            </div>
            <div class="summary-card total">
              <div class="label">Materiales con Stock Bajo</div>
              <div class="value mono" id="invSummaryBajoStock">0</div>
            </div>
          </div>

          <div class="filter-row">
            <label class="filter-check">
              <input type="checkbox" id="filterSoloBajoStock">
              Mostrar solo stock bajo
            </label>
          </div>

          <div class="table-scroll"><table>
            <thead><tr>
              <th>Código</th><th>Descripción</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Valor</th>
            </tr></thead>
            <tbody id="existenciasBody"></tbody>
          </table></div>
          <div class="empty-state" id="existenciasEmptyState" hidden>Aún no hay materiales en el catálogo.</div>
        </div>
      </section>

      <section id="view-movimientos" class="view">
        <div class="wrap">
          <div class="head-row">
            <h1>Movimientos</h1>
            <div class="toolbar">
              <button class="btn btn-primary" id="btnNuevoMovimiento">+ Nuevo Movimiento</button>
            </div>
          </div>

          <div class="filter-row">
            <div class="filter-field">
              <label>Desde</label>
              <input type="date" id="movFilterDesde">
            </div>
            <div class="filter-field">
              <label>Hasta</label>
              <input type="date" id="movFilterHasta">
            </div>
            <div class="filter-field">
              <label>Material</label>
              <select id="movFilterMaterial"><option value="">Todos</option></select>
            </div>
            <button class="btn btn-ghost" id="movBtnClearFilter">Limpiar filtro</button>
          </div>

          <div class="table-scroll"><table>
            <thead><tr>
              <th>Fecha</th><th>Material</th><th>Tipo</th><th class="num">Cantidad</th><th>Referencia</th>
            </tr></thead>
            <tbody id="movimientosBody"></tbody>
          </table></div>
          <div class="empty-state" id="movimientosEmptyState" hidden>Aún no hay movimientos registrados.</div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-backdrop" id="movimientoModal" hidden>
    <div class="modal">
      <h2>Nuevo Movimiento</h2>
      <div class="field">
        <label>Material</label>
        <select id="f_material_id"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tipo</label>
          <select id="f_tipo">
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
            <option value="ajuste">Ajuste</option>
          </select>
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input type="number" id="f_cantidad" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="f_fecha">
      </div>
      <div class="field">
        <label>Referencia (opcional)</label>
        <input type="text" id="f_referencia" placeholder="Ej: Compra Ferretería Ramos">
      </div>
      <div class="modal-error" id="modalError"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btnCancelModal">Cancelar</button>
        <button class="btn btn-primary" id="btnSaveMovimiento">Guardar</button>
      </div>
    </div>
  </div>

<script>
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmt(n) { return "L. " + (Number(n) || 0).toLocaleString("es-HN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// ---- 01 Existencias ----

let existenciasCache = [];

async function loadExistencias() {
  const [inventario, resumen] = await Promise.all([
    fetch("/api/inventario").then(r => r.json()),
    fetch("/api/inventario/resumen").then(r => r.json()),
  ]);
  existenciasCache = inventario;

  document.getElementById("invSummaryValor").textContent = fmt(resumen.valor_total);
  document.getElementById("invSummaryBajoStock").textContent = resumen.materiales_bajo_stock;

  renderExistencias();
}

function renderExistencias() {
  const soloBajoStock = document.getElementById("filterSoloBajoStock").checked;
  const rows = soloBajoStock ? existenciasCache.filter(m => m.bajo_stock) : existenciasCache;

  document.getElementById("existenciasEmptyState").hidden = rows.length > 0;
  document.getElementById("existenciasBody").innerHTML = rows.map(m => `
    <tr class="${m.bajo_stock ? "bajo-stock" : ""}">
      <td class="mono">${esc(m.code)}</td>
      <td>${esc(m.description)}${m.bajo_stock ? '<span class="bajo-badge">⚠ Stock bajo</span>' : ""}</td>
      <td class="num mono ${m.bajo_stock ? "text-danger" : ""}">${m.stock}</td>
      <td class="num mono">${m.minimo_stock}</td>
      <td class="num mono">${fmt(m.valor)}</td>
    </tr>
  `).join("");
}

document.getElementById("filterSoloBajoStock").addEventListener("change", renderExistencias);

// ---- 02 Movimientos ----

let materialesCache = [];
let movimientosLoaded = false;

async function loadMateriales() {
  materialesCache = await fetch("/api/catalog/material").then(r => r.json());
  const options = materialesCache.map(m => `<option value="${m.id}">${esc(m.code)} — ${esc(m.description)}</option>`).join("");
  document.getElementById("f_material_id").innerHTML = options;
  document.getElementById("movFilterMaterial").innerHTML = '<option value="">Todos</option>' + options;
}

function currentMovFilterParams() {
  const params = new URLSearchParams();
  const desde = document.getElementById("movFilterDesde").value;
  const hasta = document.getElementById("movFilterHasta").value;
  const materialId = document.getElementById("movFilterMaterial").value;
  if (desde) params.set("desde", desde);
  if (hasta) params.set("hasta", hasta);
  if (materialId) params.set("material_id", materialId);
  return params;
}

async function loadMovimientos() {
  const params = currentMovFilterParams();
  const movimientos = await fetch(`/api/inventario/movimientos?${params.toString()}`).then(r => r.json());

  document.getElementById("movimientosEmptyState").hidden = movimientos.length > 0;
  document.getElementById("movimientosBody").innerHTML = movimientos.map(m => `
    <tr>
      <td>${esc(m.fecha)}</td>
      <td>${esc(m.material_code)} — ${esc(m.material_description)}</td>
      <td><span class="estado-badge tipo-${esc(m.tipo)}">${esc(m.tipo)}</span></td>
      <td class="num mono">${m.cantidad}</td>
      <td>${esc(m.referencia || "—")}</td>
    </tr>
  `).join("");
}

document.getElementById("movFilterDesde").addEventListener("change", loadMovimientos);
document.getElementById("movFilterHasta").addEventListener("change", loadMovimientos);
document.getElementById("movFilterMaterial").addEventListener("change", loadMovimientos);
document.getElementById("movBtnClearFilter").addEventListener("click", () => {
  document.getElementById("movFilterDesde").value = "";
  document.getElementById("movFilterHasta").value = "";
  document.getElementById("movFilterMaterial").value = "";
  loadMovimientos();
});

function openMovimientoModal() {
  document.getElementById("modalError").textContent = "";
  document.getElementById("f_material_id").value = materialesCache[0] ? materialesCache[0].id : "";
  document.getElementById("f_tipo").value = "entrada";
  document.getElementById("f_cantidad").value = "";
  document.getElementById("f_fecha").value = new Date().toISOString().slice(0, 10);
  document.getElementById("f_referencia").value = "";
  document.getElementById("movimientoModal").hidden = false;
}

document.getElementById("btnNuevoMovimiento").addEventListener("click", openMovimientoModal);
document.getElementById("btnCancelModal").addEventListener("click", () => { document.getElementById("movimientoModal").hidden = true; });

document.getElementById("btnSaveMovimiento").addEventListener("click", async () => {
  const body = {
    material_id: document.getElementById("f_material_id").value,
    tipo: document.getElementById("f_tipo").value,
    cantidad: document.getElementById("f_cantidad").value,
    fecha: document.getElementById("f_fecha").value,
    referencia: document.getElementById("f_referencia").value,
  };
  const res = await fetch("/api/inventario/movimientos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById("modalError").textContent = data.error || "Error al guardar.";
    return;
  }
  document.getElementById("movimientoModal").hidden = true;
  loadMovimientos();
  loadExistencias(); // a new movement changes computed stock/valuation on the other tab
});

// ---- Sidebar view switching ----

document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`view-${btn.dataset.view}`).classList.add("active");
    if (btn.dataset.view === "movimientos" && !movimientosLoaded) {
      movimientosLoaded = true;
      loadMovimientos();
    }
  });
});

fetch("/api/me").then(r => r.json()).then(me => {
  if (me.authenticated && me.company_name) document.getElementById("topbarClient").textContent = "Inventario — " + me.company_name;
});

(async () => {
  await loadMateriales();
  await loadExistencias();
})();
</script>
</body>
</html>
