<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Grupo Liquidámbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16232f; --ink-soft: #5a6570; --red: #b5453b; --dark: #0f1720; --accent: #cddc28; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: var(--dark);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    max-width: 380px; width: 90%; padding: 40px 36px;
    border-radius: 16px; background: #182430; border: 1px solid #2a3644;
  }
  .badge {
    display: inline-block; background: var(--accent); color: var(--dark);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 4px 12px; border-radius: 999px; margin-bottom: 18px;
  }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 24px; color: #fff; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: #8b98a6; font-weight: 600; margin-bottom: 5px;
  }
  .field input {
    width: 100%; padding: 11px 12px; border: 1.5px solid #2a3644; border-radius: 8px;
    background: #0f1720; color: #fff; font-size: 14px; font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: var(--dark); border: none; border-radius: 8px;
    padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px;
  }
  button:hover { opacity: 0.9; }
  .error {
    background: #3a1f1c; border: 1px solid var(--red); color: #f2b3ac; border-radius: 8px;
    font-size: 13px; padding: 9px 12px; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="badge">Administración</div>
    <h1>Panel de Administración</h1>
    <div class="error" id="errorBox"></div>
    <div class="field"><label>Usuario</label><input type="text" id="username" autocomplete="username" required></div>
    <div class="field"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button type="submit">Entrar</button>
  </form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  errorBox.style.display = "none";
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorBox.textContent = data.error || "No se pudo iniciar sesión.";
      errorBox.style.display = "block";
      return;
    }
    window.location.href = "/admin/";
  } catch (err) {
    errorBox.textContent = "Error de conexión.";
    errorBox.style.display = "block";
  }
});
</script>
</body>
</html>
